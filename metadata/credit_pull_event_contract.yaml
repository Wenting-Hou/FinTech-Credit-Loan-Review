contract_name: credit_pull_event
version: 1.0.0
status: active
dataset:
  file_name: credit_pull_event.csv
  path: data/structured/raw/credit_pull_event.csv
  format: csv
  encoding: UTF-8
  delimiter: ","
  header_required: true
  null_representation: ""
  grain: each row represents one credit bureau pull or credit re-pull event for an applicant on a specific date
  primary_key: [event_id]
  expected_row_count: 1775
  privacy_classification: restricted_academic
  source_lineage:
    primary_source: synthetic_academic_fixture
    notes: Credit-pull events are synthetic academic data. One observation per pull; applicants with NO_HISTORY have no pulls.
fields:
  - name: event_id
    type: string
    required: true
    unique: true
    pattern: "^E[0-9]{7}$"
  - name: application_id
    type: string
    required: true
    pattern: "^APP[0-9]{6}$"
  - name: event_date
    type: date
    required: true
  - name: fico_score
    type: integer
    required: false
    minimum: 300
    maximum: 850
    notes: Score returned by the pull. Empty on Error and Pending pulls, which returned no result.
  - name: bureau_source
    type: string
    required: true
    allowed_values: [TransUnion, Experian, Equifax]
  - name: event_status
    type: string
    required: true
    allowed_values: [Completed, Pending, Error, Resubmitted]
  - name: event_reason
    type: string
    required: true
    allowed_values:
      [
        Initial Application,
        Fraud Verification,
        Re-Pull After Correction,
        Manual Review,
        Credit Refresh,
      ]
quality_rules:
  - rule_id: CREDIT_PULL_001
    expectation: event_id is unique, not null, and matches the E####### format
    severity: error
  - rule_id: CREDIT_PULL_002
    expectation: application_id is not null and matches the APP###### format
    severity: error
  - rule_id: CREDIT_PULL_003
    expectation: event_date is a valid credit-pull event date
    severity: error
  - rule_id: CREDIT_PULL_004
    expectation: fico_score is between 300 and 850 when populated
    severity: error
  - rule_id: CREDIT_PULL_005
    expectation: fico_score is empty exactly when event_status is Error or Pending, and a Pending pull is no older than 14 days before the extract date
    severity: error
  - rule_id: CREDIT_PULL_006
    expectation: bureau_source, event_status, and event_reason contain only approved categorical values
    severity: error
  - rule_id: CREDIT_PULL_007
    expectation: every application_id references an application in the loan_application dataset
    severity: error
  - rule_id: CREDIT_PULL_008
    expectation: all records are synthetic and contain no direct personal identifiers
    severity: critical
  - rule_id: CREDIT_PULL_009
    expectation: event_date is on or before the application date and within the 24-month lookback; applications with credit_history_status NO_HISTORY have no pulls
    severity: error

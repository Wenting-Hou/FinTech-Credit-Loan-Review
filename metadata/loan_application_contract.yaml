contract_name: loan_application
version: 1.0.0
status: active
dataset:
  file_name: loan_application.csv
  path: data/structured/raw/loan_application.csv
  format: csv
  encoding: UTF-8
  delimiter: ","
  header_required: true
  null_representation: ""
  grain: each row represents a single application submitted by a single applicant on a specific date
  primary_key: [application_id]
  expected_row_count: 600
  privacy_classification: restricted_academic
  source_lineage:
    primary_source: synthetic_academic_fixture
    notes: Loan application, credit, and pre-decision fields are synthetic academic data.
fields:
  - name: application_id
    type: string
    required: true
    unique: true
    pattern: "^APP[0-9]{6}$"
  - name: annual_income_usd
    type: decimal
    required: true
    minimum: 0
  - name: applicant_id
    type: string
    required: true
    unique: true
    pattern: "^APP[0-9]{6}$"
    description: Unique identifier for the applicant associated with the loan application
  - name: employment_duration_months
    type: integer
    required: true
    minimum: 0
  - name: fico_score
    type: integer
    required: false
    minimum: 300
    maximum: 850
    derivation: fico_score of the latest credit_pull_event row with a returned score on or before date; empty only for NO_HISTORY applicants
  - name: region_state
    type: string
    required: true
    pattern: "^[A-Z]{2}$"
  - name: requested_amount_usd
    type: decimal
    required: true
    minimum: 0
  - name: product_code
    type: string
    required: true
    pattern: "^[A-Z0-9-]+$"
  - name: dti_pct
    type: decimal
    required: true
    minimum: 0
    maximum: 100
  - name: military_scra_flag
    type: boolean
    required: true
    allowed_values: [FALSE, TRUE]
  - name: bankruptcy_last_7y_flag
    type: boolean
    required: true
    allowed_values: [FALSE, TRUE]
  - name: collections_past_12_months_flag
    type: boolean
    required: true
    allowed_values: [FALSE, TRUE]
  - name: preliminary_decision
    type: string
    required: true
    allowed_values: [Approved, Review, Declined]
  - name: date
    type: date
    required: true
  - name: final_decision
    type: string
    required: false
    allowed_values: [Approved, Declined, Withdrawn]
  - name: final_decision_date
    type: date
    required: false
quality_rules:
  - rule_id: LOAN_APP_001
    expectation: application_id is unique, not null, and matches the APP###### format
    severity: error
  - rule_id: LOAN_APP_002
    expectation: annual_income_usd, employment_duration_months, and requested_amount_usd are non-negative
    severity: error
  - rule_id: LOAN_APP_003
    expectation: fico_score is between 300 and 850 when populated and dti_pct is between 0 and 100
    severity: error
  - rule_id: LOAN_APP_004
    expectation: military_scra_flag, bankruptcy_last_7y_flag, and collections_past_12_months_flag contain only TRUE or FALSE
    severity: error
  - rule_id: LOAN_APP_005
    expectation: region_state is a two-letter uppercase U.S. state code
    severity: error
  - rule_id: LOAN_APP_006
    expectation: date is a valid application date and preliminary_decision is one of Approved, Review, or Declined
    severity: error
  - rule_id: LOAN_APP_007
    expectation: all records are synthetic and contain no direct personal identifiers
    severity: critical
  - rule_id: LOAN_APP_008
    expectation: fico_score equals the fico_score of the latest credit_pull_event row with a returned score on or before date, and is empty exactly when applicant_risk_features.credit_history_status is NO_HISTORY
    severity: error
  - rule_id: LOAN_APP_009
    expectation: preliminary_decision is Declined when any loan_product gate fails (maximum_amount_usd, max_dti_pct, allow_bankruptcy_flag, allow_collections_flag, minimum_risk_tier tested against applicant_risk_features.risk_tier, minimum_fico, allow_no_score_flag); otherwise Review for NO_HISTORY, LIMITED_HISTORY, T4 or T5 applicants; otherwise Approved
    severity: error
  - rule_id: LOAN_APP_010
    expectation: final_decision and final_decision_date are both filled or both empty; when filled, final_decision_date is on or after date and on or before the 2026-09-14 extract date; applications dated after the extract date have no final decision
    severity: error
  - rule_id: LOAN_APP_011
    expectation: a preliminary Declined is never followed by a final Approved, and a preliminary Approved is never followed by a final Declined
    severity: error
